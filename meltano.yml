    pip_url: git+https://github.com/Matatika/tap-google-sheets@v0.7.0
  - name: tap-bing-ads
    variant: matatika
    pip_url: git+https://github.com/Matatika/tap-bing-ads-msdk.git@v0.3.1
  - name: tap-mysql
    variant: matatika
    pip_url: git+https://github.com/Matatika/pipelinewise-tap-mysql.git@v1.0.0
  - name: tap-aconex
    variant: fostersdata
    pip_url: git+https://github.com/FostersData/tap-aconex.git
  - name: tap-mssql
    variant: matatika
    pip_url: git+https://github.com/Matatika/pipelinewise-tap-mssql.git@v1.0.3
  - name: tap-meltano
    variant: matatika
    pip_url: git+https://github.com/Matatika/tap-meltano.git@v0.5.0

    variant: matatika
    pip_url: git+https://github.com/Matatika/target-snowflake--meltanolabs.git@v0.17.8-2
  transformers:
  - name: dbt
    variant: dbt-labs
    pip_url: dbt-core~=1.7.0 dbt-postgres~=1.7.0 dbt-snowflake~=1.7.0 dbt-bigquery~=1.7.0 certifi==2025.1.31
  files:
